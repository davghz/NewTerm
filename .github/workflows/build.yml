name: Independent t3rm
on:
  push:
    paths-ignore: ["**/*.md", "HistoricalNotices/**"]
  pull_request:
    paths-ignore: ["**/*.md", "HistoricalNotices/**"]
  workflow_dispatch:

jobs:
  verify:
    name: Engine, shell and packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install package tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          brew install xcodegen dpkg ldid
      - name: Test terminal engine, shell and transfers
        run: |
          swift test --package-path Independent -c release
          python3 Independent/scripts/check-prompt.py
      - name: Verify production and review packages
        run: |
          set -euo pipefail
          export DERIVED_DATA_PATH="$RUNNER_TEMP/t3rm-device"
          for variant in production review; do
            dest="$RUNNER_TEMP/t3rm-$variant"
            Independent/scripts/package.sh "$variant" "$dest"
            python3 Independent/scripts/check-package.py "$dest"/*.deb "$variant"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: t3rm-ios15-deb
          path: |
            ${{ runner.temp }}/t3rm-production/*.deb
            ${{ runner.temp }}/t3rm-production/*.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: t3rm-ios15-review-deb
          path: |
            ${{ runner.temp }}/t3rm-review/*.deb
            ${{ runner.temp }}/t3rm-review/*.sha256
          if-no-files-found: error

  ui:
    name: UI tests (${{ matrix.family }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: iPhone
            device: iPhone 16
          - family: iPad
            device: iPad Pro 11-inch (M4)
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install XcodeGen
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          brew install xcodegen
      - name: Test terminal workspace
        working-directory: Independent
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          device=$(xcrun simctl list -j devices available 'iOS 18.6' | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"] == sys.argv[1]))' "$DEVICE")
          xcrun simctl bootstatus "$device" -b
          xcodebuild -project T3rm.xcodeproj -scheme T3rm \
            -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/workspace.xcresult" test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-${{ matrix.family }}-diagnostics
          path: ${{ runner.temp }}/workspace.xcresult
          if-no-files-found: warn
