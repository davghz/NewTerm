name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'assets/**']
  pull_request:
    paths-ignore: ['**/*.md', 'assets/**']
  workflow_dispatch:

jobs:
  build:
    name: Package rootless iOS 15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: Install packaging tools
        run: brew install ldid dpkg
      - name: Build Debian package
        run: .github/scripts/package-rootless.sh
      - uses: actions/upload-artifact@v4
        with:
          name: t3rm-ios15-rootless
          path: |
            packages/*.deb
            packages/*.sha256
          if-no-files-found: error
