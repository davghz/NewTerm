name: Independent t3rm
on:
  push:
    paths-ignore: ["**/*.md", "HistoricalNotices/**"]
  pull_request:
    paths-ignore: ["**/*.md", "HistoricalNotices/**"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode and install package tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_16.4.app
          brew install xcodegen dpkg ldid
      - name: Test terminal engine, shell and transfers
        run: |
          swift test --package-path Independent -c release
          python3 Independent/scripts/check-prompt.py
      - name: Test iPhone and iPad workspaces
        working-directory: Independent
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          for family in iPhone iPad; do
            device=$(xcrun simctl list -j devices available | python3 -c 'import json,sys; print(next(d["udid"] for devices in reversed(list(json.load(sys.stdin)["devices"].values())) for d in devices if d["name"].startswith(sys.argv[1])))' "$family")
            xcodebuild -project T3rm.xcodeproj -scheme T3rm -destination "platform=iOS Simulator,id=$device" -parallel-testing-enabled NO test
          done
      - name: Verify production and review packages
        run: |
          set -euo pipefail
          export DERIVED_DATA_PATH="$RUNNER_TEMP/t3rm-device"
          for variant in production review; do
            dest="$RUNNER_TEMP/t3rm-$variant"
            Independent/scripts/package.sh "$variant" "$dest"
            python3 Independent/scripts/check-package.py "$dest"/*.deb "$variant"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: t3rm-ios15-deb
          path: |
            ${{ runner.temp }}/t3rm-production/*.deb
            ${{ runner.temp }}/t3rm-production/*.sha256
          if-no-files-found: error
